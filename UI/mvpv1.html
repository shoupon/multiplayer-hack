<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Multiplayer Orchestrator · MVP v1 demo</title>
<!--
  MVP v1 demo for the Multiplayer Orchestrator (based on docs/PRD.md).
  Three phones side by side in one page:
    Phone 1 (Mei) starts a topic, answers the AI's clarifying questions and creates the chat room.
    Phones 2 and 3 (Ray, Lin) start on an invitation and join the room once it exists.
  Everything runs in this page: no backend, no build step. The AI replies are scripted for the demo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{
  --ink:#222222; --muted:#6A6A6A; --line:#DDDDDD; --soft:#F7F7F7; --bubble:#F1F1F1;
  --brand:#D7264C; --brand-ink:#B01E3E; --brand-soft:#FFF0F3; --white:#FFFFFF;
  --shadow:0 6px 20px rgba(0,0,0,0.08); --shadow-lg:0 24px 60px rgba(0,0,0,0.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--soft);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background-color:#F3F3F3;background-image:radial-gradient(#D6D6D6 1px,transparent 1px);background-size:20px 20px}
button,input,textarea{font-family:inherit}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:var(--white);border-bottom:1px solid #EBEBEB}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-0.01em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--brand);display:inline-flex;align-items:center;justify-content:center}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.ghost{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.stage{display:flex;gap:56px;justify-content:center;padding:36px 28px 48px;overflow-x:auto}
.col{display:flex;flex-direction:column;gap:12px;flex:none}
.frame-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.frame-label b{color:var(--ink);font-weight:700}
.dot{width:8px;height:8px;border-radius:999px}
.phone{width:390px;height:844px;border-radius:52px;background:#1A1A1A;padding:10px;box-shadow:var(--shadow-lg)}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--white);display:flex;flex-direction:column;position:relative}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:999px;background:#1A1A1A;z-index:3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* screen parts */
.appbar{display:flex;align-items:center;gap:10px;padding:52px 18px 12px;background:var(--white)}
.appbar.bordered{border-bottom:1px solid #EBEBEB}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--white);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;flex:none}
.body{flex:1;min-height:0;overflow-y:auto;padding:8px 22px 16px;display:flex;flex-direction:column;gap:14px}
.foot{padding:12px 18px 26px;background:var(--white);border-top:1px solid #EBEBEB}
.eyebrow{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.h1{margin:0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-0.02em}
.lead{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:700}
textarea.input{min-height:132px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;font-size:16px;line-height:1.5;color:var(--ink);resize:none;outline:none}
textarea.input:focus,input.input:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
input.input{flex:1;min-width:0;height:48px;padding:0 18px;border:1px solid var(--line);border-radius:999px;font-size:16px;color:var(--ink);outline:none;background:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip.answer{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.primary{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--brand);color:var(--white);font-size:16px;font-weight:700;cursor:pointer}
.primary:hover{background:var(--brand-ink)}
.primary:disabled{background:#EBEBEB;color:#8A8A8A;cursor:not-allowed}
.send{width:48px;height:48px;border-radius:999px;border:0;background:var(--brand);color:var(--white);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.send:hover{background:var(--brand-ink)}
.row{display:flex;gap:8px;align-items:center}
.progress{height:4px;border-radius:999px;background:#EBEBEB;overflow:hidden;margin:0 18px 6px}
.progress > div{height:4px;border-radius:999px;background:var(--ink);transition:width .25s ease}

/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column-reverse;background:var(--white)}
.chat-inner{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sys{margin:4px 0;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.who{font-size:11px;font-weight:700;color:var(--muted);margin:0 0 4px 4px}
.ai-who{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 4px 2px}
.ai-dot{width:18px;height:18px;border-radius:6px;background:var(--brand);display:inline-flex;align-items:center;justify-content:center}
.bubble{padding:10px 14px;font-size:14.5px;line-height:1.45;max-width:100%;word-wrap:break-word}
.msg{display:flex;flex-direction:column;max-width:82%}
.msg.left{align-self:flex-start}
.msg.right{align-self:flex-end}
.b-other{background:var(--bubble);border-radius:18px 18px 18px 6px}
.b-mine{background:var(--ink);color:var(--white);border-radius:18px 18px 6px 18px}
.b-ai{background:var(--white);border:1px solid #EBEBEB;border-radius:18px 18px 18px 6px;box-shadow:var(--shadow)}
.card{border:1px solid #EBEBEB;border-radius:18px;padding:16px;background:var(--white);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.01em}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-top:10px;border-top:1px solid #EBEBEB}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700;text-align:right}
.private{border:1.5px solid var(--ink);border-radius:18px;padding:12px 14px;background:var(--white);display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ink);color:var(--white)}
.avatars{display:flex}
.av{width:30px;height:30px;border-radius:999px;color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--white);margin-left:-8px}
.av:first-child{margin-left:0}
.av.pending{background:#EBEBEB !important;color:#8A8A8A}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:999px;background:#B0B0B0;display:block;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* invite */
.invite-hero{margin:4px 0 0;border-radius:22px;padding:22px;background:var(--brand-soft);display:flex;flex-direction:column;gap:14px}
.host-av{width:56px;height:56px;border-radius:999px;background:var(--ink);color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.waiting{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spinner{width:16px;height:16px;border-radius:999px;border:2px solid #DDDDDD;border-top-color:var(--ink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}


/* agent proposal + agent log panel */
.proposal{border:1.5px solid var(--ink);border-radius:18px;padding:14px;background:var(--white);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.proposal .steps{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.proposal .steps div{display:flex;gap:8px;align-items:flex-start}
.proposal .steps svg{flex:none;margin-top:2px}
.quote{background:var(--soft);border-radius:12px;padding:12px;font-size:14.5px;line-height:1.45}
.btns{display:flex;gap:8px}
.btn-sm{flex:1;min-height:44px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-sm.solid{border:0;background:var(--brand);color:#FFFFFF}
.btn-sm.solid:hover{background:var(--brand-ink)}
.btn-sm.line{border:1px solid var(--line);background:#FFFFFF;color:var(--ink)}
.btn-sm.line:hover{border-color:var(--ink)}
textarea.edit{width:100%;min-height:90px;padding:12px;border:1px solid var(--ink);border-radius:12px;font-size:15px;line-height:1.45;resize:none;outline:none}
.done-note{font-size:12px;font-weight:600;color:var(--muted)}
.menu-btn{margin-left:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,0.32);opacity:0;pointer-events:none;transition:opacity .28s ease;z-index:6}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:absolute;top:0;right:0;bottom:0;width:88%;background:#FFFFFF;z-index:7;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:-16px 0 40px rgba(0,0,0,0.18);display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{display:flex;align-items:center;gap:10px;padding:52px 16px 12px;border-bottom:1px solid #EBEBEB}
.panel-head .t{flex:1;min-width:0}
.panel-head .t b{display:block;font-size:15px;font-weight:800}
.panel-head .t span{display:block;font-size:12px;color:var(--muted)}
.log{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.log-item{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.log-ic{width:26px;height:26px;border-radius:8px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ink)}
.log-ic.agent{background:var(--brand);color:#FFFFFF}
.log-ic.owner{background:var(--ink);color:#FFFFFF}
.log-item small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
.log-empty{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.panel,.scrim{transition:none}}

@media (max-width:640px){
  .topbar{padding:12px 16px}
  .brand small{display:none}
  .stage{justify-content:flex-start;gap:20px;padding:20px 16px 32px;scroll-snap-type:x mandatory}
  .col{scroll-snap-align:center}
  .phone{width:calc(100vw - 40px);max-width:390px;height:780px;border-radius:44px;padding:8px}
  .screen{border-radius:36px}
}
@media (prefers-reduced-motion:reduce){.typing i,.spinner{animation:none}.progress > div{transition:none}}
</style>
</head>
<body>
<header class="topbar">
<div class="brand">
<span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><circle cx="5" cy="5" r="2"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="12" cy="21" r="2"></circle><path d="M6.5 6.5 9.8 9.8M17.5 6.5 14.2 9.8M12 15v4"></path></svg></span>
<span>Orchestrator<small>MVP v1 · three-phone demo</small></span>
</div>
<button type="button" class="ghost" id="reset">Start over</button>
</header>
<main class="stage" id="stage" aria-label="Three phones"></main>

<script>
(function () {
var PEOPLE = {
  Mei: { name: 'Mei', color: '#222222', label: 'Starts the topic' },
  Ray: { name: 'Ray', color: '#0E7C86', label: 'Invited' },
  Lin: { name: 'Lin', color: '#B5541B', label: 'Invited' }
};
var ORDER = ['Mei', 'Ray', 'Lin'];
/* What each person's own agent knows (sample data for the demo). */
var KNOW = {
  Ray: { calendar: 'Busy 18:00–18:40 (team standup), free after', prefs: 'Skips spicy food, usually picks noodles',
         draft: "I'm in. I can be there from 18:45. Noodles work for me, nothing spicy please." },
  Lin: { calendar: 'Busy 18:00–18:50 (gym), free from 19:00', prefs: 'Vegetarian, prefers somewhere quiet',
         draft: "Count me in from 19:00. I'm vegetarian, so I need a veggie option. Somewhere quiet would be great." }
};
var QS = [
  { q: 'When does this need to be settled?', k: 'Settle by', chips: ['Tonight', 'This week', 'No rush'] },
  { q: 'Is there a budget to stay within?', k: 'Budget', chips: ['Under NT$ 5,000', 'NT$ 5,000–10,000', 'No budget'] },
  { q: 'Who should be in the room?', k: 'People', chips: ['Ray and Lin', 'Ray, Lin and their teams'] },
  { q: 'How do we make the final call?', k: 'Final call', chips: ['I decide', 'We vote', 'AI suggests, I approve'] }
];
var EXAMPLES = ['Dinner for the three teams tonight', 'Pick a venue for Friday', 'Split a group order'];

var S;
function fresh() {
  S = { step: 'topic', topic: '', answers: [], created: false, joined: { Ray: false, Lin: false }, messages: [], typing: false,
        proposals: {}, sent: { Ray: false, Lin: false }, planApproved: false,
        panel: { Mei: false, Ray: false, Lin: false },
        log: { Mei: [], Ray: [{ who: 'agent', text: 'Watching for invitations for Ray.' }], Lin: [{ who: 'agent', text: 'Watching for invitations for Lin.' }] } };
}
fresh();
function log(p, who, text) { S.log[p].push({ who: who, text: text }); }

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function title() { return S.topic.trim() || 'New room'; }
var ARROW = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>';
var BACK = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>';
var MENU = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>';
var CLOSE = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>';
var SPARK = '<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"></path></svg>';
var CAL = '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>';
var HEART = '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"></path></svg>';
var CHAT = '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>';
var USER = '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>';
var LOCK = '<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>';

function avatar(p, pending) { return '<span class="av' + (pending ? ' pending' : '') + '" style="background:' + PEOPLE[p].color + '" title="' + p + '">' + p.charAt(0) + '</span>'; }
function members() { return ['Mei'].concat(['Ray', 'Lin'].filter(function (p) { return S.joined[p]; })); }
function menuBtn(p) { return '<button type="button" class="icon-btn menu-btn" data-act="panel" data-who="' + p + '" aria-label="Open ' + p + '\'s agent log" aria-expanded="' + (S.panel[p] ? 'true' : 'false') + '">' + MENU + '</button>'; }
function aiWho(label) { return '<div class="ai-who"><span class="ai-dot" style="color:#FFFFFF">' + SPARK + '</span>' + label + '</div>'; }

/* ---------- scripted AI ---------- */
function later(fn, ms) { S.typing = true; render(); setTimeout(function () { S.typing = false; fn(); render(); }, ms || 900); }
function createRoom() {
  S.created = true; S.step = 'room';
  S.messages.push({ kind: 'system', text: 'Mei created the room' });
  S.messages.push({ kind: 'brief' });
  log('Mei', 'agent', 'Created the room “' + title() + '” and sent invitations to Ray and Lin.');
  ['Ray', 'Lin'].forEach(function (p) { log(p, 'orch', 'Invitation from Mei: “' + title() + '”.'); log(p, 'agent', 'Told ' + p + ' about the invitation.'); });
  render();
  later(function () { S.messages.push({ kind: 'ai', text: "I've invited Ray and Lin. When they join, their own agents will draft an answer for each of them to approve." }); }, 800);
}
function join(p) {
  S.joined[p] = true;
  S.messages.push({ kind: 'system', text: p + ' joined' });
  S.messages.push({ kind: 'ai', text: p + ', what works for you? Your agent can draft it for you.' });
  log(p, 'owner', p + ' accepted the invitation and joined.');
  log(p, 'orch', 'Orchestrator asked: what works for you?');
  render();
  setTimeout(function () {
    var k = KNOW[p];
    log(p, 'tool', 'Checked calendar: ' + k.calendar + '.');
    log(p, 'tool', 'Looked at what I know about ' + p + ': ' + k.prefs + '.');
    log(p, 'agent', 'Drafted an answer and asked ' + p + ' to approve or edit it.');
    S.proposals[p] = { status: 'pending', text: k.draft };
    S.messages.push({ kind: 'proposal', to: p });
    render();
  }, 1200);
}
function sendProposal(p, text, edited) {
  text = text.trim(); if (!text) return;
  S.proposals[p].status = 'sent'; S.proposals[p].text = text; S.sent[p] = true;
  S.messages.push({ kind: 'user', from: p, text: text, viaAgent: true, edited: edited });
  log(p, 'owner', p + (edited ? ' edited the draft and sent it.' : ' approved the draft as written.'));
  log(p, 'agent', 'Posted the answer to the room.');
  if (S.sent.Ray && S.sent.Lin) {
    later(function () {
      S.messages.push({ kind: 'ai', text: 'Both answers are in. Plan: start at 19:00 so everyone can make it, include a veggie option, nothing spicy, somewhere quiet, within the budget. Mei, over to you.' });
      S.messages.push({ kind: 'approve', to: 'Mei' });
      log('Mei', 'orch', 'Ray and Lin answered. Orchestrator drafted a plan for you to approve.');
    }, 1100);
  } else { render(p); }
}
function approvePlan() {
  S.planApproved = true;
  S.messages.push({ kind: 'system', text: 'Mei approved the plan' });
  log('Mei', 'owner', 'Mei approved the plan.');
  ['Ray', 'Lin'].forEach(function (p) { log(p, 'orch', 'Mei approved the plan. Nothing else needed from ' + p + '.'); });
  later(function () { S.messages.push({ kind: 'ai', text: "Done. I'll book it and post the details here. (Booking runs as a mock in this demo.)" }); }, 900);
}
function post(from, text) {
  text = text.trim(); if (!text) return;
  S.messages.push({ kind: 'user', from: from, text: text });
  log(from, 'owner', from + ' wrote to the room: “' + text + '”');
  render(from);
}

/* ---------- screens ---------- */
function hostTopic() {
  return '<div class="appbar"><div class="avatars">' + avatar('Mei') + '</div><span class="eyebrow" style="margin-left:6px">New topic</span>' + menuBtn('Mei') + '</div>' +
    '<div class="body">' +
    '<p class="eyebrow" style="margin-top:6px">Hi Mei</p>' +
    '<h1 class="h1">What do you want to decide together?</h1>' +
    '<p class="lead">Describe it in a sentence. The AI asks a few questions, then opens a chat room for everyone.</p>' +
    '<div class="field"><label for="topic">Topic</label><textarea id="topic" class="input" placeholder="e.g. Dinner for the three teams tonight">' + esc(S.topic) + '</textarea></div>' +
    '<p class="eyebrow">Try one</p><div class="chips">' + EXAMPLES.map(function (e) { return '<button type="button" class="chip" data-act="example" data-val="' + esc(e) + '">' + esc(e) + '</button>'; }).join('') + '</div>' +
    '</div>' +
    '<div class="foot"><button type="button" class="primary" data-act="to-questions"' + (S.topic.trim() ? '' : ' disabled') + '>Continue</button></div>';
}
function hostQuestions() {
  var n = S.answers.length, cur = n < QS.length ? QS[n] : null, h = [];
  h.push('<div class="appbar"><button type="button" class="icon-btn" data-act="back-topic" aria-label="Back">' + BACK + '</button><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">Set up the room</div><div style="font-size:12px;color:var(--muted)">' + (cur ? 'Question ' + (n + 1) + ' of ' + QS.length : 'All set') + '</div></div>' + menuBtn('Mei') + '</div>');
  h.push('<div class="progress" aria-hidden="true"><div style="width:' + Math.round(n / QS.length * 100) + '%"></div></div>');
  h.push('<div class="chat"><div class="chat-inner">');
  h.push('<div class="msg right"><div class="bubble b-mine">' + esc(title()) + '</div></div>');
  S.answers.forEach(function (a, i) {
    h.push('<div class="msg left">' + aiWho('Orchestrator') + '<div class="bubble b-ai">' + esc(QS[i].q) + '</div></div>');
    h.push('<div class="msg right"><div class="bubble b-mine">' + esc(a) + '</div></div>');
  });
  if (cur) {
    h.push('<div class="msg left">' + aiWho('Orchestrator') + '<div class="bubble b-ai" style="font-weight:700">' + esc(cur.q) + '</div></div>');
    h.push('<div class="chips" role="group" aria-label="Suggested answers">' + cur.chips.map(function (c) { return '<button type="button" class="chip" data-act="answer" data-val="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>');
  } else { h.push(briefCard(true)); }
  h.push('</div></div>');
  if (cur) h.push('<div class="foot"><div class="row"><label for="ans-Mei" class="sr">Your own answer</label><input id="ans-Mei" class="input" type="text" placeholder="Or type your own answer" data-enter="answer"><button type="button" class="send" data-act="answer-typed" aria-label="Send answer">' + ARROW + '</button></div></div>');
  else h.push('<div class="foot"><button type="button" class="primary" data-act="create">Create chat room</button></div>');
  return h.join('');
}
function briefCard(editable) {
  return '<div class="card"><h3>' + esc(title()) + '</h3>' + S.answers.map(function (a, i) { return '<div class="kv"><span>' + esc(QS[i].k) + '</span><span>' + esc(a) + '</span></div>'; }).join('') +
    (editable ? '<button type="button" class="ghost" data-act="redo" style="align-self:flex-start">Change answers</button>' : '') + '</div>';
}
function guestInvite(p) {
  var h = '<div class="appbar"><div class="avatars">' + avatar(p) + '</div><span class="eyebrow" style="margin-left:6px">Invitation</span>' + menuBtn(p) + '</div><div class="body">';
  h += '<div class="invite-hero"><span class="host-av" aria-hidden="true">M</span>' +
       '<div><p class="eyebrow" style="color:#7A2A3B">Mei invited you</p><h1 class="h1" style="font-size:24px;margin-top:6px">' + (S.created ? esc(title()) : 'A new room') + '</h1></div>' +
       (S.created ? '' : '<div class="waiting"><span class="spinner" aria-hidden="true"></span>Mei is still setting it up…</div>') + '</div>';
  if (S.created) {
    h += '<div class="card" style="gap:6px">' + S.answers.map(function (a, i) { return '<div class="kv" style="' + (i === 0 ? 'border-top:0;padding-top:0' : '') + '"><span>' + esc(QS[i].k) + '</span><span>' + esc(a) + '</span></div>'; }).join('') + '</div>';
    h += '<div class="row" style="gap:12px"><div class="avatars">' + avatar('Mei') + avatar('Ray', !S.joined.Ray) + avatar('Lin', !S.joined.Lin) + '</div><span style="font-size:13px;color:var(--muted)">' + members().length + ' of 3 in the room</span></div>';
  }
  h += '<p class="lead" style="font-size:14px">After you join, your own agent checks your calendar and drafts an answer for you to approve. Nobody else sees what\'s marked “Only you”.</p></div>';
  h += '<div class="foot"><button type="button" class="primary" data-act="join" data-who="' + p + '"' + (S.created ? '' : ' disabled') + '>' + (S.created ? 'Join the chat' : 'Waiting for Mei') + '</button></div>';
  return h;
}
function proposalCard(p) {
  var pr = S.proposals[p], k = KNOW[p];
  var h = '<div class="proposal"><span class="pill">' + LOCK + 'Only you · ' + p + '\'s agent</span>';
  if (pr.status === 'sent') return h + '<div class="done-note">You sent this to the room.</div></div>';
  h += '<div class="steps"><div>' + CAL + '<span>' + esc(k.calendar) + '</span></div><div>' + HEART + '<span>' + esc(k.prefs) + '</span></div></div>';
  if (pr.status === 'editing') {
    h += '<label for="edit-' + p + '" class="sr">Edit the answer</label><textarea id="edit-' + p + '" class="edit">' + esc(pr.text) + '</textarea>';
    h += '<div class="btns"><button type="button" class="btn-sm line" data-act="cancel-edit" data-who="' + p + '">Cancel</button><button type="button" class="btn-sm solid" data-act="send-edit" data-who="' + p + '">Send</button></div>';
  } else {
    h += '<div style="font-size:13px;font-weight:700">I\'d answer for you:</div><div class="quote">' + esc(pr.text) + '</div>';
    h += '<div class="btns"><button type="button" class="btn-sm line" data-act="edit" data-who="' + p + '">Edit</button><button type="button" class="btn-sm solid" data-act="approve" data-who="' + p + '">Approve &amp; send</button></div>';
  }
  return h + '</div>';
}
function approveCard() {
  var h = '<div class="proposal"><span class="pill">' + LOCK + 'Only you · final call</span>';
  if (S.planApproved) return h + '<div class="done-note">You approved this plan.</div></div>';
  return h + '<div class="quote">Start at 19:00 · veggie option · nothing spicy · somewhere quiet · within budget</div>' +
    '<div class="btns"><button type="button" class="btn-sm line" data-act="change-plan">Change</button><button type="button" class="btn-sm solid" data-act="approve-plan">Approve plan</button></div></div>';
}
function chat(p) {
  var h = '<div class="appbar bordered"><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(title()) + '</div><div style="font-size:12px;color:var(--muted)">' + members().join(', ') + '</div></div><div class="avatars">' + avatar('Mei') + avatar('Ray', !S.joined.Ray) + avatar('Lin', !S.joined.Lin) + '</div>' + menuBtn(p) + '</div>';
  h += '<div class="chat"><div class="chat-inner">';
  S.messages.forEach(function (m) {
    if ((m.kind === 'proposal' || m.kind === 'approve') && m.to !== p) return;
    if (m.kind === 'system') h += '<p class="sys">' + esc(m.text) + '</p>';
    else if (m.kind === 'brief') h += '<div class="msg left" style="max-width:100%;align-self:stretch">' + aiWho('Orchestrator · room brief') + briefCard(false) + '</div>';
    else if (m.kind === 'ai') h += '<div class="msg left">' + aiWho('Orchestrator') + '<div class="bubble b-ai">' + esc(m.text) + '</div></div>';
    else if (m.kind === 'proposal') h += proposalCard(p);
    else if (m.kind === 'approve') h += approveCard();
    else {
      var tag = m.viaAgent ? '<div class="who" style="margin:4px 4px 0;font-weight:600">' + (m.edited ? 'Edited from agent draft' : 'Drafted by agent · approved') + '</div>' : '';
      if (m.from === p) h += '<div class="msg right"><div class="bubble b-mine">' + esc(m.text) + '</div>' + tag.replace('margin:4px 4px 0', 'margin:4px 4px 0;text-align:right') + '</div>';
      else h += '<div class="msg left"><div class="who">' + esc(m.from) + '</div><div class="bubble b-other">' + esc(m.text) + '</div>' + tag + '</div>';
    }
  });
  if (S.typing) h += '<div class="msg left">' + aiWho('Orchestrator') + '<div class="b-ai typing" aria-label="Orchestrator is typing"><i></i><i></i><i></i></div></div>';
  h += '</div></div>';
  h += '<div class="foot"><div class="row"><label for="msg-' + p + '" class="sr">Message as ' + p + '</label><input id="msg-' + p + '" class="input" type="text" placeholder="Message" data-enter="send" data-who="' + p + '"><button type="button" class="send" data-act="send" data-who="' + p + '" aria-label="Send">' + ARROW + '</button></div></div>';
  return h;
}
var LOG_ICON = { agent: ['agent', SPARK, 'Agent'], tool: ['', CAL, 'Agent · tool'], owner: ['owner', USER, 'You'], orch: ['', CHAT, 'Orchestrator'] };
function panel(p) {
  var items = S.log[p];
  var h = '<div class="scrim' + (S.panel[p] ? ' open' : '') + '" data-act="panel" data-who="' + p + '" data-scrim="' + p + '"></div>';
  h += '<aside class="panel' + (S.panel[p] ? ' open' : '') + '" data-panel="' + p + '" aria-label="' + p + '\'s agent log"' + (S.panel[p] ? '' : ' aria-hidden="true" inert') + '>';
  h += '<div class="panel-head"><span class="log-ic agent" aria-hidden="true">' + SPARK + '</span><div class="t"><b>' + p + '\'s agent</b><span>What it did and why</span></div><button type="button" class="icon-btn" data-act="panel" data-who="' + p + '" aria-label="Close agent log">' + CLOSE + '</button></div>';
  h += '<div class="log">' + (items.length ? items.map(function (it) {
    var ic = LOG_ICON[it.who];
    return '<div class="log-item"><span class="log-ic ' + ic[0] + '" aria-hidden="true">' + ic[1] + '</span><div><small>' + (it.who === 'owner' ? p : ic[2]) + '</small>' + esc(it.text) + '</div></div>';
  }).join('') : '<p class="log-empty">Nothing yet. Start a topic and the steps show up here.</p>') + '</div></aside>';
  return h;
}
function screen(p) {
  if (p === 'Mei') return S.step === 'topic' ? hostTopic() : S.step === 'questions' ? hostQuestions() : chat('Mei');
  return S.joined[p] ? chat(p) : guestInvite(p);
}

/* ---------- render, keeping typed text and focus ---------- */
function render(focusWho) {
  var keep = {}, active = document.activeElement && document.activeElement.id;
  document.querySelectorAll('#stage input, #stage textarea').forEach(function (el) { keep[el.id] = el.value; });
  document.getElementById('stage').innerHTML = ORDER.map(function (p, i) {
    var P = PEOPLE[p];
    return '<section class="col" aria-label="Phone ' + (i + 1) + ': ' + p + '"><div class="frame-label"><span class="dot" style="background:' + P.color + '"></span><b>' + (i + 1) + ' · ' + p + '</b>' + P.label + '</div>' +
      '<div class="phone"><div class="screen"><div class="island" aria-hidden="true"></div>' + screen(p) + panel(p) + '</div></div></section>';
  }).join('');
  Object.keys(keep).forEach(function (id) { var el = document.getElementById(id); if (el && id !== 'topic' && id.indexOf('edit-') !== 0 && !(focusWho && id === 'msg-' + focusWho)) el.value = keep[id]; });
  var f = focusWho ? document.getElementById('msg-' + focusWho) : (active ? document.getElementById(active) : null);
  if (f) { f.focus({ preventScroll: true }); if (f.setSelectionRange && f.value) f.setSelectionRange(f.value.length, f.value.length); }
}
function togglePanel(p) {
  S.panel[p] = !S.panel[p];
  var pn = document.querySelector('[data-panel="' + p + '"]'), sc = document.querySelector('[data-scrim="' + p + '"]');
  pn.classList.toggle('open', S.panel[p]); sc.classList.toggle('open', S.panel[p]);
  if (S.panel[p]) { pn.removeAttribute('aria-hidden'); pn.removeAttribute('inert'); var c = pn.querySelector('[data-act="panel"]'); if (c) c.focus(); }
  else { pn.setAttribute('aria-hidden', 'true'); pn.setAttribute('inert', ''); }
  document.querySelectorAll('.menu-btn[data-who="' + p + '"]').forEach(function (b) { b.setAttribute('aria-expanded', S.panel[p] ? 'true' : 'false'); });
}

/* ---------- events ---------- */
var stage = document.getElementById('stage');
stage.addEventListener('input', function (e) {
  if (e.target.id === 'topic') {
    S.topic = e.target.value;
    var btn = stage.querySelector('[data-act="to-questions"]'); if (btn) btn.disabled = !S.topic.trim();
  }
});
stage.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { ORDER.forEach(function (p) { if (S.panel[p]) togglePanel(p); }); return; }
  if (e.key !== 'Enter' || e.isComposing) return;
  var t = e.target;
  if (t.getAttribute('data-enter') === 'send') { post(t.getAttribute('data-who'), t.value); }
  if (t.getAttribute('data-enter') === 'answer' && t.value.trim()) { addAnswer(t.value.trim()); var n = document.getElementById('ans-Mei'); if (n) n.focus(); }
});
function addAnswer(a) { var i = S.answers.length; S.answers.push(a); log('Mei', 'orch', 'Orchestrator asked: ' + QS[i].q); log('Mei', 'owner', 'Mei answered: ' + a); render(); }
stage.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), val = b.getAttribute('data-val'), who = b.getAttribute('data-who');
  if (act === 'panel') { togglePanel(who); }
  else if (act === 'example') { S.topic = val; render(); }
  else if (act === 'to-questions') { if (S.topic.trim()) { S.step = 'questions'; log('Mei', 'owner', 'Mei started a topic: “' + title() + '”.'); log('Mei', 'agent', 'Asked the Orchestrator to set up a room and clarify the topic.'); render(); } }
  else if (act === 'back-topic') { S.step = 'topic'; render(); }
  else if (act === 'answer') { addAnswer(val); }
  else if (act === 'answer-typed') { var i = document.getElementById('ans-Mei'); if (i && i.value.trim()) addAnswer(i.value.trim()); }
  else if (act === 'redo') { S.answers = []; log('Mei', 'owner', 'Mei chose to change the answers.'); render(); }
  else if (act === 'create') { createRoom(); }
  else if (act === 'join') { join(who); }
  else if (act === 'approve') { sendProposal(who, S.proposals[who].text, false); }
  else if (act === 'edit') { S.proposals[who].status = 'editing'; render(); var ed = document.getElementById('edit-' + who); if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); } }
  else if (act === 'cancel-edit') { S.proposals[who].status = 'pending'; render(); }
  else if (act === 'send-edit') { var ta = document.getElementById('edit-' + who); if (ta) sendProposal(who, ta.value, ta.value.trim() !== S.proposals[who].text); }
  else if (act === 'approve-plan') { approvePlan(); }
  else if (act === 'change-plan') { var m = document.getElementById('msg-Mei'); if (m) { m.value = 'Can we change: '; m.focus(); } }
  else if (act === 'send') { var mm = document.getElementById('msg-' + who); if (mm) post(who, mm.value); }
});
document.getElementById('reset').addEventListener('click', function () { fresh(); render(); });
render();
})();
</script>
</body>
</html>
