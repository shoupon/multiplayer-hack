[project]
name = "fcl-a2a-eval"
version = "0.1.0"
description = "Cross-provider agent-to-agent eval loop for the Family Coordination Layer: a Claude agent and an OpenAI agent coordinate through FCL's MCP tools."
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["a2a_eval"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
